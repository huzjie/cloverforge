apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloverforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloverforge
  template:
    metadata:
      labels:
        app: cloverforge
    spec:
      containers:
        - name: cloverforge
          image: cloverforge:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8788
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: cloverforge
spec:
  selector:
    app: cloverforge
  ports:
    - port: 80
      targetPort: 8788
  type: ClusterIP
